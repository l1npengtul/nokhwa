[package]
name = "nokhwa-core"
version = "0.2.0"
authors = ["l1npengtul <l1npengtul@protonmail.com>"]
edition = "2024"
description = "Core type definitions for nokhwa"
keywords = ["camera", "webcam", "capture", "cross-platform"]
categories = ["api-bindings", "multimedia", "web-programming"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/l1npengtul/nokhwa"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
serialize = ["serde", "ordered-float/serde"]
wgpu = ["wgpu-types"]
opencv-mat = ["opencv", "opencv/clang-runtime"]
docs-features = ["serialize", "wgpu-types"]
async = ["async-trait", "flume/async", "futures-core"]
test-fail-warnings = []


[dependencies]
thiserror = "2.0"
flume = "0.11"
num-traits = "0.2"
ordered-float = "5"
typed-builder = "0.21"
compact_str = "0.9"
bytemuck = "1.23"
smallmap = "1.4"
paste = "1.0"

[dependencies.num-rational]
version = "0.4"
default-features = false
features = ["serde", "std"]

[dependencies.image]
workspace = true

[dependencies.serde]
workspace = true
optional = true

[dependencies.wgpu-types]
workspace = true
optional = true

[dependencies.opencv]
workspace = true
optional = true

[dependencies.async-trait]
version = "0.1"
optional = true

[dependencies.futures-core]
version = "0.3"
optional = true

[package.metadata.docs.rs]
features = ["docs-features"]
